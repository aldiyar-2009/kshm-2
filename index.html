<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>КШМ-2 · 3D-модель</title>
  <meta name="description" content="Интерактивная 3D-презентация командно-штабной машины КШМ-2 на шасси КАМАЗ 43118-23027-50: разобранный вид, срез и обзор отсеков изнутри.">
  <meta name="theme-color" content="#0b0f14">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
</head>
<body class="" data-view="product">
  <canvas id="scene" aria-label="3D-модель КШМ-2"></canvas>
  <div id="hotspots"></div>
  <div id="tooltip" role="tooltip"></div>

  <header class="brand">
    <button id="menu-btn" class="menu-btn glass" aria-label="Разделы">
      <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <div class="brand-mark">PIRANT</div>
    <div class="brand-text">
      <h1>КШМ-2</h1>
      <p>на шасси КАМАЗ 43118-23027-50</p>
    </div>
  </header>

  <div class="modes glass" id="modes" role="tablist" aria-label="Режим просмотра">
    <button role="tab" data-view="product" aria-selected="true">Продукт</button>
    <button role="tab" data-view="xray" aria-selected="false">Рентген</button>
    <button role="tab" data-view="cut" aria-selected="false">Разрез</button>
    <button role="tab" data-view="exploded" aria-selected="false"><span class="l">Разобранный</span><span class="s">Разбор</span></button>
    <button role="tab" data-view="laid" aria-selected="false">Раскладка</button>
  </div>

  <nav class="nav glass" id="nav">
    <p class="nav-h">Обзор</p>
    <button data-nav="overview">Общий вид</button>
    <button data-nav="chassis">Шасси 6×6</button>
    <button data-nav="body">Фургон</button>
    <button data-nav="dish">Спутниковая антенна</button>
    <button data-nav="masts">Мачты 10 м</button>
    <button data-nav="xray">Рентген: каркас</button>
    <button data-nav="exploded">Из чего состоит</button>
    <button data-nav="laid">Раскладка узлов</button>
    <p class="nav-h">Отсеки изнутри</p>
    <button data-nav="layout">Планировка</button>
    <button data-nav="room1"><b>1</b>Бытовой отсек 1</button>
    <button data-nav="room2"><b>2</b>Операторский</button>
    <button data-nav="room3"><b>3</b>Кухня и санузел</button>
    <button data-nav="room4"><b>4</b>Командно-штабной</button>
    <p class="nav-h">Данные</p>
    <button data-nav="specs">Характеристики</button>
  </nav>

  <aside class="card glass" id="card">
    <button id="card-toggle" class="card-toggle" aria-label="Свернуть описание">
      <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <div id="card-body"></div>
  </aside>

  <div class="insidebar glass" id="insidebar">
    <button id="inside-prev" aria-label="Предыдущий отсек"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
    <div><small>Вы внутри</small><strong id="inside-title"></strong><em>Тяните — осмотреться · колесо — приблизить</em></div>
    <button id="inside-next" aria-label="Следующий отсек"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
    <button id="inside-exit" class="exit">Выйти наружу</button>
  </div>

  <div class="tourbar glass" id="tourbar">
    <div class="tour-progress"><i id="tour-progress"></i></div>
    <div class="tour-row">
      <span id="tour-count" class="tour-count"></span>
      <strong id="tour-title"></strong>
      <button id="tour-prev" aria-label="Назад"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
      <button id="tour-play" aria-label="Пауза / продолжить" aria-pressed="false">
        <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z"/></svg>
        <svg class="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg>
      </button>
      <button id="tour-next" aria-label="Дальше"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
      <button id="tour-close" aria-label="Закрыть экскурсию"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
  </div>

  <div class="dock">
    <div class="layers glass" id="layers" aria-label="Слои">
      <button data-layer="skin" aria-pressed="true" style="--sw:#c9d1d9"><i></i>Обшивка</button>
      <button data-layer="frame" aria-pressed="true" style="--sw:#6fb39b"><i></i>Каркас</button>
      <button data-layer="interior" aria-pressed="true" style="--sw:#b58a5c"><i></i>Интерьер</button>
      <button data-layer="equip" aria-pressed="true" style="--sw:#ff6a1a"><i></i>Оборудование</button>
      <button data-layer="chassis" aria-pressed="true" style="--sw:#2a2f35"><i></i>Шасси</button>
    </div>
    <div class="subbar glass" id="subbar" role="group" aria-label="Узел">
      <span class="lbl">Узел</span>
      <button data-focus="all" aria-pressed="true">Целиком</button>
      <button data-focus="cab" aria-pressed="false">Кабина</button>
      <button data-focus="chassis" aria-pressed="false">Шасси</button>
      <button data-focus="body" aria-pressed="false">Фургон</button>
      <button data-focus="equip" aria-pressed="false">Мачты и антенна</button>
      <button data-focus="interior" aria-pressed="false">Интерьер</button>
      <label class="amount"><span>Разлёт</span><input id="amount" type="range" min="15" max="100" value="100" aria-label="Степень разлёта деталей"></label>
    </div>
    <div class="toolbar glass" role="toolbar" aria-label="Действия">
      <button id="btn-tour" aria-pressed="false" class="primary">
        <svg viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z"/></svg><span>Экскурсия</span>
      </button>
      <button id="btn-deploy" aria-pressed="false">
        <svg viewBox="0 0 24 24"><path d="M12 21V8M8 21h8M7 7a7 7 0 0 1 10 0M4.5 4.5a10.5 10.5 0 0 1 15 0"/></svg><span>Развернуть</span>
      </button>
      <button id="btn-layers" aria-pressed="false">
        <svg viewBox="0 0 24 24"><path d="M3 8l9-5 9 5-9 5z"/><path d="M3 13l9 5 9-5" opacity=".5"/></svg><span>Слои</span>
      </button>
      <button id="btn-points" aria-pressed="true">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8" opacity=".5"/></svg><span>Метки</span>
      </button>
      <button id="btn-auto" aria-pressed="true" class="ico" aria-label="Автовращение" title="Автовращение">
        <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></svg><span>Вращение</span>
      </button>
      <button id="btn-theme" class="ico" aria-label="Светлая / тёмная тема" title="Светлая / тёмная тема">
        <svg class="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
        <svg class="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button id="btn-reset" class="ico" aria-label="Сброс вида" title="Сброс вида">
        <svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7M5 10v10h14V10"/></svg>
      </button>
    </div>
  </div>

  <p class="hint">Вращение — тянуть · масштаб — колесо · сдвиг — правая кнопка · клик по детали — описание</p>

  <div id="loader"><div class="spin"></div><p>Сборка модели КШМ-2…</p></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
